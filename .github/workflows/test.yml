name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check
        run: for f in src/*.js scripts/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: node --test
